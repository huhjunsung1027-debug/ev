name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: gradlew 실행권한
        run: chmod +x ./gradlew

      - name: Debug APK 빌드
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Release APK 빌드
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/EvDash.apk

      - name: Artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: evdash-apk
          path: out/EvDash.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release에 올리기 (바로 다운로드용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest out/EvDash.apk \
            --title "EV Dash 최신 빌드" \
            --notes "커밋 ${{ github.sha }} 기준 자동 빌드"
